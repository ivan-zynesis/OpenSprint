<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanban</title>
<!--
  opensprint live board — a static template (DEC-BOARD-READ-BY-GIT).

  The page needs no server and loads nothing (DS-RUNTIME-LESS-BOARD). It is
  filled twice:

    when opensprint writes it, the opensprint:config marker becomes an
      application/json script element, id board-config: { columns, owned, ... }

    when the /opsp:kanban render playbook runs, the opensprint:cards marker becomes
      a text/plain script element, id board-meta: base64 of key=value lines
          keys: ref, sha, at, repo, main, parent
      one text/plain script element, class card, per card: base64 of cards/(id).md

  Base64 keeps any card text from breaking the page. The script below decodes
  it as UTF-8 and parses each card itself, building every node with
  createElement — card text is never read as HTML.
-->
<style>
  :root {
    --bg: #f6f7f9; --panel: #eceef2; --card: #ffffff; --text: #1d2027; --muted: #5f6775;
    --border: #cfd4dc; --accent: #3b5bdb; --accent-bg: #e7ecff; --back: #8a5a00; --back-bg: #fff4e0;
    --warn: #b3261e; --ok: #2b7a3d; --code-bg: #f1f3f6; --tip-bg: #1d2027; --tip-text: #f6f7f9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --panel: #1c1f25; --card: #242830; --text: #e6e8ec; --muted: #9aa1ad;
      --border: #454b58; --accent: #8ca2ff; --accent-bg: #2a3352; --back: #f0b45a; --back-bg: #3a2e1a;
      --warn: #ff8a80; --ok: #7fd18f; --code-bg: #1b1e24; --tip-bg: #e6e8ec; --tip-text: #14161a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code-bg);
         padding: 1px 4px; border-radius: 4px; }

  .top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
         padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .top h1 { margin: 0; font-size: 18px; }
  .meta { color: var(--muted); font-size: 12px; }
  .actions { margin-left: auto; display: flex; gap: 8px; }
  .legend { width: 100%; color: var(--muted); font-size: 12px; }
  .legend:empty { display: none; }

  .board { display: grid; grid-template-columns: repeat(var(--columns, 5), minmax(0, 1fr)); gap: 12px; padding: 16px; }
  @media (max-width: 1100px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 640px) { .board { grid-template-columns: 1fr; } .actions { margin-left: 0; } }
  .column { background: var(--panel); border-radius: 10px; padding: 10px; min-height: 120px; min-width: 0; }
  .column h2 { margin: 2px 4px 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
               display: flex; justify-content: space-between; color: var(--muted); }
  .empty { color: var(--muted); margin: 4px; font-size: 12px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px;
          padding: 10px 12px; margin-bottom: 10px; }
  .card header { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
  .card h3 { margin: 0; font-size: 14px; overflow-wrap: anywhere; flex: 1 1 auto; min-width: 0; }
  .owner { flex: 0 1 auto; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
           font-size: 11px; padding: 2px 8px; border-radius: 999px;
           background: var(--accent-bg); color: var(--accent); }
  .owner.none { background: transparent; color: var(--muted); border: 1px dashed var(--border); }
  .owner.missing { color: var(--warn); border-color: var(--warn); flex: none; max-width: none; }
  .summary { margin: 8px 0; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 4;
             -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .summary strong { color: var(--text); }
  dl { margin: 8px 0 0; display: grid; gap: 2px; font-size: 12px; }
  dl div { display: flex; gap: 6px; min-width: 0; }
  dt { color: var(--muted); width: 64px; flex: none; }
  dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .progress { height: 4px; border-radius: 2px; background: var(--panel); margin: 8px 0 2px; overflow: hidden; }
  .progress span { display: block; height: 100%; background: var(--ok); }
  details { margin-top: 8px; font-size: 12px; color: var(--muted); }
  details summary { cursor: pointer; }
  details ol, details ul { margin: 6px 0 0; padding-left: 18px; }
  .milestones li { margin: 2px 0; }
  .stage { font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; padding: 0 5px; border-radius: 4px;
           border: 1px solid var(--border); margin-right: 4px; }
  .stage.done { color: var(--ok); border-color: var(--ok); }
  .stage.specifying, .stage.building, .stage.review { color: var(--accent); border-color: var(--accent); }
  .milestones li.superseded .name { text-decoration: line-through; }

  /* Escalations on the left; the one way forward — continue the stage's workflow — on the right. */
  .moves { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; padding-top: 10px;
           border-top: 1px dashed var(--border); position: relative; }
  .moves .back, .moves .forward { display: flex; flex-wrap: wrap; gap: 6px; }
  .moves .forward { margin-left: auto; }

  button { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 6px; cursor: pointer;
           border: 1px solid var(--border); background: var(--card); color: var(--text); }
  .top button { position: relative; }
  button:hover { border-color: var(--accent); }
  button.forward { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
  button.back { border-color: var(--back); color: var(--back); background: var(--back-bg); }
  button[data-tip]:hover::after, button[data-tip]:focus-visible::after {
    content: attr(data-tip); position: absolute; z-index: 10; left: 0; bottom: calc(100% + 6px);
    width: max-content; max-width: 300px; white-space: pre-line; text-align: left;
    background: var(--tip-bg); color: var(--tip-text); padding: 7px 9px; border-radius: 6px;
    font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; pointer-events: none;
  }
  /* On a card the tooltip spans the card, so it never runs off the edge of a column. */
  .moves button[data-tip]:hover::after, .moves button[data-tip]:focus-visible::after {
    left: 0; right: 0; width: auto; max-width: none; bottom: calc(100% + 4px);
  }
  .top button[data-tip]:hover::after, .top button[data-tip]:focus-visible::after {
    left: auto; right: 0; bottom: auto; top: calc(100% + 6px);
  }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 20;
           max-width: min(640px, calc(100% - 32px)); background: var(--tip-bg); color: var(--tip-text);
           padding: 10px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .15s;
           pointer-events: none; }
  .toast.show { opacity: 1; }
  .toast code { background: transparent; color: inherit; padding: 0; }
</style>
</head>
<body>
  <div class="top">
    <h1>Kanban</h1>
    <span class="meta" id="meta">no board data — render this template with /opsp:kanban</span>
    <div class="actions" id="actions"></div>
    <div class="legend" id="legend"></div>
  </div>
  <main class="board" id="board"></main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- opensprint:config -->

<!-- opensprint:cards -->

<script>
(() => {
  const configNode = document.getElementById('board-config');
  const CONFIG = configNode
    ? JSON.parse(configNode.textContent)
    : { columns: [], owned: [], moves: { continue: {}, escalate: {} }, agent: null };
  const AGENT = CONFIG.agent;

  const decode = (b64) => new TextDecoder().decode(Uint8Array.from(atob(b64.trim()), (c) => c.charCodeAt(0)));

  function parseKeyValues(text) {
    const out = {};
    for (const line of text.split(/\r?\n/)) {
      const i = line.indexOf('=');
      if (i > 0) out[line.slice(0, i)] = line.slice(i + 1);
    }
    return out;
  }

  // The card format src/core/kanban.ts writes: frontmatter, a summary, then
  // "## Milestones" ("- [stage] name: description") and "## History".
  function parseCard(text) {
    const match = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
    if (!match) return null;
    const card = { milestones: [], history: [] };
    for (const line of match[1].split(/\r?\n/)) {
      const kv = line.match(/^([a-z]+):\s?(.*)$/);
      if (kv) card[kv[1]] = kv[2].trim();
    }
    const sections = { '': [] };
    let current = '';
    for (const line of match[2].split(/\r?\n/)) {
      if (line === '## Milestones' || line === '## History') { current = line; sections[current] = []; continue; }
      sections[current].push(line);
    }
    const items = (heading) => (sections[heading] || []).filter((l) => l.startsWith('- ')).map((l) => l.slice(2));
    card.summary = sections[''].join('\n').trim();
    for (const item of items('## Milestones')) {
      const m = item.match(/^\[([a-z]+)\]\s?(.*)$/);
      if (!m) continue;
      const colon = m[2].indexOf(':');
      card.milestones.push(colon === -1
        ? { name: '', description: m[2].trim(), stage: m[1] }
        : { name: m[2].slice(0, colon).trim(), description: m[2].slice(colon + 1).trim(), stage: m[1] });
    }
    card.history = items('## History');
    return card.id ? card : null;
  }

  // A card goes in the first column whose states hold its state and, where the
  // column says, whether anyone holds the card (KANBAN_COLUMNS).
  function columnFor(state, held) {
    return CONFIG.columns.find((c) => c.states.includes(state) && (c.held === undefined || c.held === held));
  }
  function columnOf(card) {
    const column = columnFor(card.state, Boolean(card.owner));
    return column ? column.key : null;
  }

  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v === undefined || v === null || v === false) continue;
      if (k === 'class') node.className = v;
      else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v);
    }
    for (const child of children.flat()) {
      if (child === null || child === undefined || child === false) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  }

  // The little Markdown a summary carries: `code`, **bold**, [[record]] — built as nodes, never as HTML.
  function inline(text) {
    const out = [];
    const re = /`([^`]+)`|\*\*([^*]+)\*\*|\[\[([A-Za-z0-9-]+)\]\]/g;
    let last = 0;
    for (let m; (m = re.exec(text)); ) {
      out.push(text.slice(last, m.index));
      out.push(m[2] !== undefined ? el('strong', {}, m[2]) : el('code', {}, m[1] ?? m[3]));
      last = re.lastIndex;
    }
    out.push(text.slice(last));
    return out;
  }

  const metaNode = document.getElementById('board-meta');
  const META = metaNode ? parseKeyValues(decode(metaNode.textContent)) : {};
  const when = (iso) => (iso || '—').replace('T', ' ').replace('Z', ' UTC');

  // Superseded milestones are kept on the card and left out of progress, as BOARD.md counts them.
  function milestoneSummary(card) {
    if (card.milestones.length === 0) return null;
    const live = card.milestones.filter((m) => m.stage !== 'superseded');
    const done = live.filter((m) => m.stage === 'done').length;
    const next = live.find((m) => m.stage !== 'done');
    const percent = live.length === 0 ? 100 : Math.round((done / live.length) * 100);
    return el('div', {},
      el('div', { class: 'progress', title: `${done} of ${live.length} done` }, el('span', { style: `width:${percent}%` })),
      el('details', { class: 'milestones' },
        el('summary', {}, `Milestones ${done}/${live.length}` + (next ? ` · next: ${next.name || next.description}` : '')),
        el('ul', {}, card.milestones.map((m) =>
          el('li', { class: m.stage, title: m.description },
            el('span', { class: `stage ${m.stage}` }, m.stage),
            el('span', { class: 'name' }, m.name || m.description))))));
  }

  // ── moves ─────────────────────────────────────────────────────────────────
  // Every move is written into CONFIG.moves from TRANSITIONS when opensprint
  // generates this page, so a card offers nothing the state machine refuses.
  // A button never moves a card: it copies the command that starts the
  // move's workflow in a fresh session, and the workflow moves the card when
  // its work is done (DEC-BOARD-BUTTON-LAUNCHES-SESSION).

  const SAFE_WORD = /^[A-Za-z0-9_\/.:=@%+-]+$/;
  const shellQuote = (s) => (SAFE_WORD.test(String(s)) ? String(s) : `'${String(s).replace(/'/g, `'\\''`)}'`);

  /** The prompt that starts a workflow, on a card or on nothing. */
  function promptFor(workflow, id) {
    const entry = AGENT && AGENT.workflows[workflow];
    if (entry && entry.command) return entry.command + (id ? ` ${id}` : '');
    const skill = entry && entry.skill ? entry.skill : `opensprint-${workflow}`;
    return `Use the ${skill} skill` + (id ? ` on ${id}` : '');
  }

  /** The command that starts a session with the prompt, or null where the agent has no launcher. */
  function startCommand(prompt) {
    return AGENT && AGENT.launcher ? [...AGENT.launcher, prompt].map(shellQuote).join(' ') : null;
  }

  /** Opens the card's worktree — finding it, or making it from the branch — and starts the workflow there. */
  function launchScript(card, prompt) {
    const start = startCommand(prompt);
    if (start === null) return prompt;
    const branch = card.branch || `opsp/${card.id}`;
    const fallback = `${META.parent || '..'}/${META.repo || 'repo'}-opsp-${card.id}`;
    const pattern = `refs/heads/${branch}`.replace(/\//g, '\\/');
    return [
      `cd ${shellQuote(META.main || '.')} && git fetch -q origin`,
      `WT=$(git worktree list --porcelain | awk '/^worktree /{w=substr($0,10)} /^branch ${pattern}$/{print w}')`,
      `[ -n "$WT" ] || { WT=${shellQuote(fallback)}; git worktree add -q "$WT" ${shellQuote(branch)} 2>/dev/null || git worktree add -q "$WT" -b ${shellQuote(branch)} ${shellQuote(`origin/${branch}`)}; }`,
      `cd "$WT" && ${start}`,
    ].join('\n');
  }

  /** The same, in the main checkout: for work that is not on a card yet. */
  const mainScript = (prompt) => {
    const start = startCommand(prompt);
    return start === null ? prompt : `cd ${shellQuote(META.main || '.')} && ${start}`;
  };

  const toast = document.getElementById('toast');
  let toastTimer;
  function say(...parts) {
    toast.replaceChildren(...parts);
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 4500);
  }

  async function copy(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {
      const area = el('textarea', { style: 'position:fixed;opacity:0' });
      area.value = text;
      document.body.append(area);
      area.select();
      const ok = document.execCommand('copy');
      area.remove();
      return ok;
    }
  }

  function copyButton(cls, label, tipLines, script, prompt) {
    const launches = AGENT && AGENT.launcher;
    const tip = [prompt, ...tipLines, '', launches
      ? `click: copy the command that starts a fresh ${AGENT.name} session there`
      : `click: copy the prompt, then start ${AGENT ? AGENT.name : 'your agent'} there and paste it`].join('\n');
    return el('button', {
      type: 'button', class: cls, 'data-tip': tip,
      onclick: async () => {
        const ok = await copy(script);
        say(ok ? (launches ? 'Copied — paste into a terminal to start ' : 'Copied the prompt ') : 'Could not copy. The prompt is ',
            el('code', {}, prompt), '.');
      },
    }, label);
  }

  function moveButton(card, move, cls) {
    const held = move.claims ? true : Boolean(card.owner);
    const lands = columnFor(move.to, held);
    const prompt = promptFor(move.workflow, card.id);
    const lines = cls === 'forward'
      ? [`resumes ${move.workflow} where it paused`, `hat: ${move.hat.join(' · ')}`]
      : [`escalates to ${move.hat.join(' · ')}`];
    lines.push(
      move.from === move.to ? `move: picks the card up; stays ${move.to}` : `move: ${move.from} → ${move.to}`,
      `lands: ${lands ? lands.title : move.to}`,
      `when: ${move.when}`);
    return copyButton(cls, cls === 'forward' ? `${move.label} →` : `← ${move.label}`, lines, launchScript(card, prompt), prompt);
  }

  function moves(card) {
    if (!AGENT) return null;
    const forward = CONFIG.moves.continue[card.state];
    const next = forward && (card.owner ? forward.held : forward.unheld);
    const back = CONFIG.moves.escalate[card.state] || [];
    if (!next && back.length === 0) return null;
    return el('div', { class: 'moves' },
      el('div', { class: 'back' }, back.map((m) => moveButton(card, m, 'back'))),
      el('div', { class: 'forward' }, next ? moveButton(card, next, 'forward') : null));
  }

  function renderCard(card) {
    const owned = CONFIG.owned.includes(card.state);
    const ownerChip = card.owner
      ? el('span', { class: 'owner', title: card.owner }, card.owner)
      : el('span', { class: owned ? 'owner none missing' : 'owner none' }, owned ? 'no owner' : 'unowned');
    return el('article', { class: 'card', 'data-id': card.id, 'data-state': card.state },
      el('header', {}, el('h3', {}, card.title || card.id), ownerChip),
      card.summary ? el('p', { class: 'summary' }, inline(card.summary)) : null,
      el('dl', {},
        el('div', {}, el('dt', {}, 'id'), el('dd', {}, el('code', {}, card.id))),
        el('div', {}, el('dt', {}, 'state'), el('dd', {}, card.state || '—')),
        el('div', {}, el('dt', {}, 'branch'), el('dd', {}, el('code', {}, card.branch || '—'))),
        el('div', {}, el('dt', {}, 'updated'), el('dd', {}, when(card.updated)))),
      milestoneSummary(card),
      card.history.length
        ? el('details', {}, el('summary', {}, `History (${card.history.length})`),
             el('ol', {}, card.history.map((h) => el('li', {}, h))))
        : null,
      moves(card));
  }

  const cards = [...document.querySelectorAll('script.card')]
    .map((s) => { try { return parseCard(decode(s.textContent)); } catch { return null; } })
    .filter(Boolean)
    .sort((a, b) => (b.updated || '').localeCompare(a.updated || ''));

  const board = document.getElementById('board');
  board.style.setProperty('--columns', String(CONFIG.columns.length || 1));
  for (const column of CONFIG.columns) {
    const inColumn = cards.filter((c) => columnOf(c) === column.key);
    board.append(el('section', { class: 'column', 'data-column': column.key },
      el('h2', {}, column.title, el('span', {}, String(inColumn.length))),
      inColumn.length ? inColumn.map(renderCard) : el('p', { class: 'empty' }, 'Nothing here.')));
  }

  if (META.ref) {
    document.getElementById('meta').replaceChildren(`${META.ref} @ `, el('code', {}, META.sha || '?'),
      ` · ${cards.length} card(s) · read ${when(META.at)}`);
  }

  // Work that is not on a card yet starts in the main checkout: backlog makes the item's own branch.
  if (AGENT) {
    const backlog = promptFor('backlog');
    const refresh = promptFor('kanban');
    document.getElementById('actions').replaceChildren(
      copyButton('', 'Refresh', ['re-run the render playbook: fetch the board, fill this template', 'nothing keeps running in between'],
        mainScript(refresh), refresh),
      copyButton('forward', '+ Backlog an item', ['hat: product · maintainer', 'move: → exploring', 'lands: Backlog'],
        mainScript(backlog), backlog));
    document.getElementById('legend').replaceChildren(
      el('strong', {}, 'Continue →'), ' resumes the stage’s workflow where it paused; the card moves on when that work is done. ',
      el('strong', {}, '← back'), ' escalates up a rung — dev · devops to product · maintainer to the operator — and jumps to the state it reopens. ',
      'A button copies a command; paste it into a terminal. Nothing on this page runs anything.');
  }
})();
</script>
</body>
</html>
